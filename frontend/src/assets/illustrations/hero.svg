<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Hands passing a box of fresh food</title>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc80"/><stop offset="1" stop-color="#f6a54c"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity=".05"/></linearGradient>
  </defs>
  <circle cx="260" cy="225" r="190" fill="url(#glow)"/>
  <circle cx="260" cy="225" r="140" fill="#ffffff" fill-opacity=".12"/>
  <!-- leaves -->
  <g class="float-slow">
    <path d="M70 120c40-30 90-20 100 10-40 25-80 25-100-10z" fill="#66bb6a"/>
    <path d="M78 120c30 2 60 6 90 10" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g class="float-fast">
    <path d="M430 90c-10 45-50 70-80 55 5-45 40-65 80-55z" fill="#81c784"/>
    <path d="M425 95c-20 18-45 34-72 47" stroke="#2e7d32" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- produce poking out of box -->
  <g>
    <rect x="232" y="118" width="14" height="70" rx="6" fill="#43a047" transform="rotate(-12 239 150)"/>
    <ellipse cx="226" cy="112" rx="26" ry="14" fill="#66bb6a" transform="rotate(-30 226 112)"/>
    <circle cx="300" cy="160" r="34" fill="#e53935"/>
    <path d="M300 128c4-12 14-18 24-18" stroke="#2e7d32" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="292" cy="146" rx="8" ry="5" fill="#ffffff" fill-opacity=".4"/>
    <ellipse cx="200" cy="170" rx="44" ry="26" fill="#fdd835"/>
    <path d="M160 170c18-6 60-6 80 0" stroke="#f9a825" stroke-width="4" fill="none"/>
    <circle cx="350" cy="182" r="22" fill="#fb8c00"/>
    <path d="M350 160v-10" stroke="#2e7d32" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- box -->
  <path d="M150 190h220l-18 140H168z" fill="url(#box)"/>
  <path d="M150 190h220l-10 26H160z" fill="#e8913a"/>
  <rect x="226" y="236" width="68" height="44" rx="10" fill="#ffffff" fill-opacity=".85"/>
  <path d="M248 258l8 8 16-18" stroke="#43a047" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hands -->
  <path d="M60 300c30-10 70-8 100 4l20 10c10 5 8 20-4 20h-46c-25 0-45 10-70 10z" fill="#f2b98c"/>
  <path d="M40 296h40v60H40z" fill="#5c6bc0"/>
  <path d="M460 300c-30-10-70-8-100 4l-20 10c-10 5-8 20 4 20h46c25 0 45 10 70 10z" fill="#c68a5c"/>
  <path d="M480 296h-40v60h40z" fill="#8e24aa"/>
  <!-- hearts -->
  <path class="float-fast" d="M120 60c0-10 14-14 18-4 4-10 18-6 18 4 0 12-18 22-18 22s-18-10-18-22z" fill="#ff6f91"/>
  <path class="float-slow" d="M390 250c0-8 11-11 14-3 3-8 14-5 14 3 0 9-14 17-14 17s-14-8-14-17z" fill="#ff6f91"/>
  <style>
    .float-slow{animation:f 6s ease-in-out infinite}
    .float-fast{animation:f 4s ease-in-out infinite reverse}
    @keyframes f{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    @media (prefers-reduced-motion: reduce){.float-slow,.float-fast{animation:none}}
  </style>
</svg>
