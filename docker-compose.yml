services:
  mongodb:
    image: mongo:7.0
    container_name: zeroplate-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - zeroplate-network

  redis:
    image: redis:7-alpine
    container_name: zeroplate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zeroplate-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zeroplate-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-mongodb://mongodb:27017/zeroplate}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4200}
      - JWT_SECRET=${JWT_SECRET:-zeroplate_secret_key_change_me}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zeroplate-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zeroplate-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - zeroplate-network

volumes:
  mongo-data:
  redis-data:

networks:
  zeroplate-network:
    driver: bridge
